<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital — 9º B</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <!-- Cabeçalho -->
    <header class="cabecalho">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">9º Ano B — Nº 14</p>
    </header>

    <!-- Área de cards de resumo -->
    <section class="cards-resumo">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="valor">—</p>
        <span id="media-geral-texto" class="subtexto">—</span>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="valor">—</p>
        <span id="total-faltas-texto" class="subtexto">—</span>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="disciplinas-bom" class="valor">—</p>
        <span id="disciplinas-bom-texto" class="subtexto">—</span>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="disciplinas-atencao" class="valor">—</p>
        <span id="disciplinas-atencao-texto" class="subtexto">—</span>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia" class="valor">92%</p>
        <span class="subtexto">Frequência adequada</span>
      </div>
    </section>

    <!-- Área de gráficos -->
    <section class="area-graficos">

      <article class="grafico-card">
        <h2>Média por disciplina</h2>
        <div class="grafico-container grafico-alto">
          <canvas id="graficoMediasDisciplinas"></canvas>
        </div>
      </article>

      <article class="grafico-card">
        <h2>Evolução da média geral</h2>
        <div class="grafico-container">
          <canvas id="graficoEvolucaoTrimestres"></canvas>
        </div>
      </article>

      <article class="grafico-card">
        <h2>Faltas por trimestre</h2>
        <div id="estadoFaltas"></div>
        <div class="grafico-container">
          <canvas id="graficoFaltasTrimestres"></canvas>
        </div>
      </article>

    </section>

    <!-- Tabela do boletim -->
    <div class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- Linhas inseridas via JavaScript -->
        </tbody>
      </table>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
